<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QTimer v0.1 MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header"><div><h1>QTimer</h1><p>기출문제 속도훈련 · 취약문제 압축</p></div><div class="header-metrics"><span id="progressText">0 / 0</span><span id="weakCount">취약 0</span></div></header>
  <section class="control-bar" aria-label="학습 설정"><label>모드<select id="modeSelect"><option value="rapid">빠른 회독</option><option value="learn">학습</option><option value="weak">취약 집중</option></select></label><label>제한<select id="timerPolicy"><option value="hard">Hard Limit</option><option value="soft">Soft Limit</option><option value="none">No Limit</option></select></label><label>목표시간(초)<input id="timeLimit" type="number" min="5" max="180" step="5" value="20" /></label><label>자동이동 지연<select id="autoDelay"><option value="0">즉시</option><option value="500" selected>0.5초</option><option value="1000">1초</option></select></label><button id="restartBtn" type="button">회독 다시 시작</button></section>
  <main class="workspace"><section class="question-pane" aria-labelledby="questionTitle"><div class="question-meta"><span id="questionTitle">문제</span><span id="sourceMeta"></span><a id="sourceImageLink" target="_blank" rel="noopener noreferrer">원본 보기</a></div><div class="timer-row"><div id="timer" class="timer">00.0</div><span id="timerState" class="status-chip">READY</span><button id="pauseBtn" type="button">일시정지(P)</button></div><article><h2 id="questionText"></h2><div id="choices" class="choices" role="radiogroup" aria-label="선택지"></div></article><div class="confidence-row" aria-label="확신도"><button id="sureBtn" type="button">확실</button><button id="ambiguousBtn" type="button">△ 애매(A)</button><button id="unknownBtn" type="button">? 모름(M)</button></div><div class="action-row"><button id="submitBtn" class="primary" type="button">정답 제출 (Enter)</button><button id="nextBtn" type="button" disabled>다음 문제</button><button id="undoBtn" type="button">마지막 기록 취소 (Ctrl+Z)</button></div><p class="shortcut-help">단축키: 1~4 답 선택 · A 애매 · M 모름 · Enter 제출/다음 · P 일시정지 · Space 타이머 시작/정지</p></section><aside class="result-pane" aria-live="polite"><div id="preSubmitMessage" class="empty-state">답을 제출하면 정오·확신·시간과 해설이 표시됩니다.</div><div id="resultContent" hidden><div class="result-summary"><span id="correctnessBadge" class="result-badge"></span><span id="confidenceBadge" class="result-badge"></span><span id="timeBadge" class="result-badge"></span></div><dl class="answer-summary"><div><dt>내 답</dt><dd id="userAnswerText"></dd></div><div><dt>채점 정답</dt><dd id="effectiveAnswerText"></dd></div></dl><section><h3>핵심</h3><p id="finalKey" class="final-key"></p></section><section><h3>문제집 해설 요약</h3><p id="sourceExplanation"></p></section><section><h3>정답 검증</h3><div class="verification-grid"><span>문제집 정답</span><strong id="sourceAnswer"></strong><span>AI 인식</span><strong id="aiDetectedAnswer"></strong><span>AI 독립 풀이</span><strong id="aiReasonedAnswer"></strong><span>사용자 검증</span><strong id="userVerifiedAnswer"></strong></div><p id="verificationState" class="verification-state"></p><div class="verification-actions"><label>최종 정답<select id="verifiedAnswerSelect"></select></label><button id="verifyBtn" type="button">사용자 정답 확정</button><button id="flagBtn" type="button">⚑ 문제/정답 이상</button></div><p id="flagState" class="flag-state"></p></section></div></aside></main>
  <section class="session-summary"><h2>현재 회독</h2><div class="summary-grid"><div><span>풀이</span><strong id="attemptedMetric">0</strong></div><div><span>정답</span><strong id="correctMetric">0</strong></div><div><span>오답</span><strong id="wrongMetric">0</strong></div><div><span>애매</span><strong id="ambiguousMetric">0</strong></div><div><span>모름</span><strong id="unknownMetric">0</strong></div><div><span>OVER</span><strong id="overMetric">0</strong></div></div></section>

  <script src="./subject04-ch01-01-06.js"></script><script src="./subject04-ch02-01-11.js"></script><script src="./subject04-ch02-12-18.js"></script><script src="./subject04-ch02-19-34.js"></script><script src="./subject04-ch02-35-53.js"></script><script src="./subject04-ch02-54-68.js"></script>
